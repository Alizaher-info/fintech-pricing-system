name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Skip full integration tests on PR, only run on main branch
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-integration-tests')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:latest
          network=host

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Start services (with cache)
      run: |
        cd deploy/compose
        # Use build cache to speed up builds
        DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker compose build --parallel
        docker compose up -d
        
    - name: Wait for services (with health check)
      run: |
        echo "Waiting for services to be ready..."
        cd deploy/compose
        
        # Wait for postgres health check
        timeout 60 bash -c 'until docker compose exec -T postgres pg_isready; do sleep 2; done'
        echo "✅ PostgreSQL is ready"
        
        # Wait for other services
        sleep 15
        
    - name: Health check
      run: |
        # Test if pricing API is responding
        cd deploy/compose
        docker compose ps
        
        # Test HTTP endpoint with retries
        curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8080/quote-test || {
          echo "Health check failed - checking logs:"
          docker compose logs
          exit 1
        }
        echo "✅ Health check passed successfully"
        
    - name: Run tests
      run: |
        cd deploy/compose
        # Add your test commands here
        echo "Tests passed!"
        
    - name: Cleanup
      if: always()
      run: |
        cd deploy/compose
        docker compose down -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        include:
          - service: pricing-api
            dockerfile: ./services/pricing-api/Dockerfile
            context: .
          - service: pricing-fetcher
            dockerfile: ./services/pricing-fetcher/Dockerfile
            context: .
          - service: backend
            dockerfile: ./deploy/docker/php/Dockerfile
            context: ./backend
          - service: frontend
            dockerfile: ./frontend/finance/Dockerfile
            context: ./frontend/finance
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  security-scan:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add staging deployment logic here
        
  deploy-production:
    needs: [test, build-and-push, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add production deployment logic here