name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up PHP (without extensions for speed)
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2
        
    - name: Cache PHP dependencies
      uses: actions/cache@v4
      with:
        path: backend/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-
        
    - name: Install PHP dependencies
      run: |
        cd backend
        composer install --no-dev --optimize-autoloader --prefer-dist
        
    - name: PHP Syntax Check (basic)
      run: |
        cd backend
        find src -name "*.php" -exec php -l {} \;
        echo "✅ PHP syntax check passed (gRPC validation via Docker)"
        
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
        
    - name: Go Syntax Check (pricing-api)
      run: |
        cd services/pricing-api
        go fmt ./...
        go vet ./...
        echo "✅ Go syntax check passed for pricing-api"
        
    - name: Go Syntax Check (pricing-fetcher)
      run: |
        cd services/pricing-fetcher
        go fmt ./...
        go vet ./...
        echo "✅ Go syntax check passed for pricing-fetcher"
        
    - name: Go Tests (basic)
      run: |
        cd services/pricing-api
        # Only test if test files exist
        if ls *_test.go 1> /dev/null 2>&1; then
          go test -v ./...
        else
          echo "ℹ️  No test files found, skipping Go tests"
        fi
        
        cd ../pricing-fetcher
        if ls *_test.go 1> /dev/null 2>&1; then
          go test -v ./...
        else
          echo "ℹ️  No test files found, skipping Go tests"
        fi
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/finance/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend/finance
        npm ci
        
    - name: Frontend lint and type check
      run: |
        cd frontend/finance
        npm run build
        echo "✅ Frontend build passed"
        
  docker-build-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - service: pricing-api
            context: .
            dockerfile: services/pricing-api/Dockerfile
          - service: pricing-fetcher
            context: .
            dockerfile: services/pricing-fetcher/Dockerfile
          - service: backend
            context: ./backend
            dockerfile: deploy/docker/php/Dockerfile
          - service: frontend
            context: ./frontend/finance
            dockerfile: frontend/finance/Dockerfile
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container
        
    - name: Build Docker image (with GitHub Actions cache)
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.context }}
        file: ${{ matrix.dockerfile }}
        tags: test-${{ matrix.service }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true
        
    - name: Test Docker image
      run: |
        # Test if binary exists and shows help/version info (with timeout)
        timeout 10s docker run --rm test-${{ matrix.service }}:latest --help || echo "Binary works (timeout expected for server)"
        
        # Quick smoke test - start server and check if it starts properly
        docker run --rm -d --name test-server-${{ matrix.service }} test-${{ matrix.service }}:latest
        sleep 3
        docker logs test-server-${{ matrix.service }}
        docker ps | grep test-server-${{ matrix.service }} && echo "✅ Server started correctly"
        docker stop test-server-${{ matrix.service }} || true

  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check README
      run: |
        if [ ! -f README.md ]; then
          echo "README.md is missing!"
          exit 1
        fi
        
    - name: Check API Documentation
      run: |
        if [ ! -f docs/api.md ] && [ ! -f protos/pricing/v1/pricing.proto ]; then
          echo "API documentation files are missing!"
          exit 1
        fi