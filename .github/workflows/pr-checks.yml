name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: ctype, iconv, pdo, pdo_pgsql, intl
        tools: composer:v2
        coverage: none

    - name: Cache PHP dependencies
      uses: actions/cache@v4
      with:
        path: backend/vendor
        key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Create .env file for CI
      run: |
        cd backend
        cp .env.example .env
        # Set required values for CI environment
        sed -i 's|APP_SECRET=.*|APP_SECRET=test-secret-key-for-ci|g' .env
        sed -i 's|DATABASE_URL=.*|DATABASE_URL="postgresql://test:test@localhost:5432/test_db"|g' .env

    - name: Install PHP dependencies
      run: |
        cd backend
        composer install --optimize-autoloader --prefer-dist --no-interaction --no-scripts
        
    - name: Run Symfony cache warmup
      run: |
        cd backend
        php bin/console cache:clear --no-warmup || echo "Cache clear skipped (database not available)"

    - name: PHP Syntax Check (basic)
      run: |
        cd backend
        find src -name "*.php" -exec php -l {} \;
        echo "✅ PHP syntax check passed (gRPC validation via Docker)"

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Go Syntax Check (pricing-api)
      run: |
        cd services/pricing-api
        go fmt ./...
        go vet ./...
        echo "✅ Go syntax check passed for pricing-api"

    - name: Go Syntax Check (pricing-fetcher)
      run: |
        cd services/pricing-fetcher
        go fmt ./...
        go vet ./...
        echo "✅ Go syntax check passed for pricing-fetcher"

    - name: Go Syntax Check (market-trading)
      run: |
        cd services/market-trading
        go fmt ./...
        go vet ./...
        echo "✅ Go syntax check passed for market-trading"

    - name: Go Tests (basic)
      run: |
        cd services/pricing-api
        # Only test if test files exist
        if ls *_test.go 1> /dev/null 2>&1; then
          go test -v ./...
        else
          echo "ℹ️  No test files found, skipping Go tests"
        fi

        cd ../pricing-fetcher
        if ls *_test.go 1> /dev/null 2>&1; then
          go test -v ./...
        else
          echo "ℹ️  No test files found, skipping Go tests"
        fi

        cd ../market-trading
        if ls *_test.go 1> /dev/null 2>&1; then
          go test -v ./...
        else
          echo "ℹ️  No test files found, skipping Go tests"
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/finance/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend/finance
        npm ci

    - name: Frontend lint and type check
      run: |
        cd frontend/finance
        npm run build
        echo "✅ Frontend build passed"

  # Docker builds removed from PR checks for speed
  # Full Docker image builds happen in CI/CD workflow after merge to main
  # This reduces PR check time from 15+ minutes to 3-5 minutes
  
  documentation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check README
      run: |
        if [ ! -f README.md ]; then
          echo "README.md is missing!"
          exit 1
        fi

    - name: Check API Documentation
      run: |
        if [ ! -f docs/api.md ] && [ ! -f protos/pricing/v1/pricing.proto ]; then
          echo "API documentation files are missing!"
          exit 1
        fi