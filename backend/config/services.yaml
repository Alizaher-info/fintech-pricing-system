# config/services.yaml
services:
  _defaults:
    autowire: true
    autoconfigure: true

  # App-Code
  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'
      - '../src/Entity/'
      - '../src/Grpc/'
      - '../src/Client/'

  # Redis client for rate limiting
  redis.rate_limiter:
    class: Predis\Client
    arguments:
      - 'redis://redis:6379/1'

  # Rate limiter service with Redis backend
  App\Service\RateLimiterService:
    arguments:
      $rateLimiterCache: '@cache.rate_limiter'
      $redisClient: '@redis.rate_limiter'

  # Google OAuth service (lightweight - no heavy dependencies)
  App\Service\GoogleOAuthService:
    arguments:
      $httpClient: '@http_client'
      $googleClientId: '%env(GOOGLE_CLIENT_ID)%'
      $googleClientSecret: '%env(GOOGLE_CLIENT_SECRET)%'

  # Token blacklist service for secure logout
  App\Service\Auth\TokenBlacklistService:
    arguments:
      $redis: '@redis.rate_limiter'

