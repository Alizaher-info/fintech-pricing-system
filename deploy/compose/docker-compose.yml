services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  php:
    build: 
      context: ../../backend
      dockerfile: ../deploy/docker/php/Dockerfile
      target: development
    environment:
      APP_ENV: dev
      PRICING_GRPC_TARGET: pricing-api:50051
      MARKET_TRADING_GRPC_TARGET: market-trading:50052
    volumes:
      - ../../backend:/var/www/html
      - cron_logs:/var/log
    depends_on:
      - db
      - pricing-api
      - market-trading

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ../../backend:/var/www/html:ro
      - ../docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php

  pricing-api:
    build: 
      context: ../..                         # ⬅️ Repo-Root als Kontext
      dockerfile: services/pricing-api/Dockerfile
    ports:
      - "50051:50051"  # gRPC Port
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: trading_platform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      DATABASE_URL: postgres://app:app@postgres:5432/trading_platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  pricing-fetcher:
    build:
      context: ../..
      dockerfile: services/pricing-fetcher/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/trading_platform?sslmode=disable
      COINGECKO_API_KEY: ""
      FETCH_INTERVAL: "60"
      LOG_LEVEL: info
      KAFKA_BROKERS: kafka:9092
      TOPIC_PRICE_UPDATES: price-updates
      TOPIC_ORDER_CREATED: order-created
      TOPIC_PRICE_ALERTS: price-alerts
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  market-trading:
    build:
      context: ../..
      dockerfile: services/market-trading/Dockerfile
    ports:
      - "50052:50052"  # gRPC Port
    environment:
      GRPC_PORT: "50052"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_PRICE_TTL: 60
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: price-updates
      KAFKA_GROUP_ID: market-trading-group
      KAFKA_WORKER_COUNT: 10
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d trading_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Kafka Services (KRaft mode - no Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  # Frontend Services
  frontend-dev:
    build:
      context: ../../frontend/finance
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend/finance:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - nginx
    profiles:
      - dev

  frontend-prod:
    build:
      context: ../../frontend/finance
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - default
    profiles:
      - prod

volumes:
  db_data:
  redis_data:
  postgres_data:
  cron_logs:
  kafka_data:

