services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  php:
    build: 
      context: ../../backend
      dockerfile: ../deploy/docker/php/Dockerfile
      target: development
    environment:
      APP_ENV: dev
      PRICING_GRPC_TARGET: pricing-api:50051
    volumes:
      - ../../backend:/var/www/html
      - cron_logs:/var/log
    depends_on:
      - db
      - pricing-api

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ../../backend:/var/www/html:ro
      - ../docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php

  pricing-api:
    build: 
      context: ../..                         # ⬅️ Repo-Root als Kontext
      dockerfile: services/pricing-api/Dockerfile
    ports:
      - "50051:50051"  # gRPC Port

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Frontend Services
  frontend-dev:
    build:
      context: ../../frontend/finance
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend/finance:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - nginx
    profiles:
      - dev

  frontend-prod:
    build:
      context: ../../frontend/finance
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - default
    profiles:
      - prod

volumes:
  db_data:
  redis_data:
  cron_logs:

