services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  php:
    build: 
      context: ../../backend
      dockerfile: ../deploy/docker/php/Dockerfile
      target: development
    environment:
      APP_ENV: dev
      PRICING_GRPC_TARGET: pricing-api:50051
    volumes:
      - ../../backend:/var/www/html
      - cron_logs:/var/log
    depends_on:
      - db
      - pricing-api

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ../../backend:/var/www/html:ro
      - ../docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - php

  pricing-api:
    build: 
      context: ../..                         # ⬅️ Repo-Root als Kontext
      dockerfile: services/pricing-api/Dockerfile
    ports:
      - "50051:50051"  # gRPC Port
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: trading_platform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      DATABASE_URL: postgres://app:app@postgres:5432/trading_platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  pricing-fetcher:
    build:
      context: ../..
      dockerfile: services/pricing-fetcher/Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/trading_platform?sslmode=disable
      COINGECKO_API_KEY: ""
      FETCH_INTERVAL: "60"
      LOG_LEVEL: info
      KAFKA_BROKERS: kafka:9092
      TOPIC_PRICE_UPDATES: price-updates
      TOPIC_ORDER_CREATED: order-created
      TOPIC_PRICE_ALERTS: price-alerts
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d trading_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # Kafka Services
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # Frontend Services
  frontend-dev:
    build:
      context: ../../frontend/finance
      dockerfile: Dockerfile
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend/finance:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080/api
    depends_on:
      - nginx
    profiles:
      - dev

  frontend-prod:
    build:
      context: ../../frontend/finance
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - default
    profiles:
      - prod

volumes:
  db_data:
  redis_data:
  postgres_data:
  cron_logs:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:

